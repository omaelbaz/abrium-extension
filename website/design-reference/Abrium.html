document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

gelog\" },\n  footProduct: \"Product\", footLegal: \"Legal\",\n  linkPrivacy: \"Privacy\", linkTerms: \"Terms\", linkContact: \"Contact\", linkCookies: \"Cookie preferences\", linkSystem: \"Design system\",\n  trust: [\"Free forever\", \"Open source\", \"Local-only\", \"No tracking\"],\n  homeFeatures: [\n    { i: \"capture\", title: \"Auto-capture\", body: \"Every artifact you open in a conversation is saved the moment it renders — including each revision, so earlier versions stay recoverable.\" },\n    { i: \"search\", title: \"Gallery & search\", body: \"A side panel that lists everything by type, conversation and date. Full-text search reaches into the artifact body, not just the title.\" },\n    { i: \"zip\", title: \"Batch export\", body: \"Select any number of artifacts and download them as a folder-structured ZIP, with correct file extensions per type.\" },\n    { i: \"globe\", title: \"Five languages, real RTL\", body: \"English, Arabic, French, Spanish and Portuguese. Arabic mirrors the entire layout — navigation, icons and reading order.\" }\n  ],\n  steps: [\n    { n: \"1\", title: \"Install and pin\", body: \"Add Abrium from the Chrome Web Store and pin it to the toolbar. No sign-up screen — there is no account.\" },\n    { n: \"2\", title: \"Work as usual\", body: \"Keep using claude.ai. When an artifact appears in Code view, Abrium files it away with its title, type and source conversation.\" },\n    { n: \"3\", title: \"Find it later\", body: \"Open the side panel, search or filter, then preview, copy, pin or export what you need.\" }\n  ],\n  featureSections: [\n    { i: \"capture\", title: \"Capture\", frame: \"capture · side panel\", body: \"Abrium watches the artifact surface of the page and stores each one locally as it appears. Revisions are versioned rather than overwritten, so a rewrite never costs you the earlier draft.\", bullets: [\"Code, Markdown, HTML, SVG and React artifacts\", \"Every revision kept as a numbered version\", \"Works retroactively on conversations you reopen\"] },\n    { i: \"search\", title: \"Organize\", frame: \"gallery · filters\", body: \"The side panel is the home for everything captured. Filter by type, pin the things you return to, and search across titles, conversation names and artifact contents.\", bullets: [\"Type filters and a pinned collection\", \"Full-text search across artifact bodies\", \"Sorted by capture time, newest first\"] },\n    { i: \"zip\", title: \"Export\", frame: \"batch selection\", body: \"Single artifacts download with the correct extension. Multi-select turns the panel into a batch tool with a bottom action bar for ZIP export or bulk pinning.\", bullets: [\"One-click download or copy to clipboard\", \"ZIP export with per-type file extensions\", \"Batch pin and batch delete\"] },\n    { i: \"lock\", title: \"Privacy\", frame: \"storage · IndexedDB\", body: \"Everything lives in your browser's local storage. There is no server to send data to, no analytics SDK, and no network request the extension makes on your behalf.\", bullets: [\"Local IndexedDB storage only\", \"No accounts, no telemetry, no ads\", \"Source code public and auditable\"] },\n    { i: \"globe\", title: \"Languages\", frame: \"interface · العربية\", body: \"The interface ships in five languages. Arabic is a full right-to-left build: the panel, the toolbars, the icons with directional meaning and the reading order all mirror.\", bullets: [\"EN · AR · FR · ES · PT\", \"Complete RTL mirroring, not flipped text\", \"Follows the browser language by default\"] }\n  ],\n  faqs: [\n    { q: \"Is Abrium free?\", a: \"Yes — free, with no paid tier and no upsell. The source is public, and the project is supported by voluntary donations only.\" },\n    { q: \"Does it read my conversations?\", a: \"No. Abrium only looks at the artifact panel of the page — the rendered artifact and its title. Message content is never parsed, stored or transmitted.\" },\n    { q: \"Why does it need Code view rather than Preview?\", a: \"Preview mode renders an artifact inside a sandboxed frame that extensions cannot read. Code view exposes the raw source in the page itself, which is what Abrium files away — so an artifact left in Preview may not be captured until you switch.\" },\n    { q: \"Is my data ever sent anywhere?\", a: \"Never. The extension makes no network requests. Everything is written to your browser's local IndexedDB and stays on your device, including when you export a ZIP.\" },\n    { q: \"What languages are supported?\", a: \"English, Arabic, French, Spanish and Portuguese. Arabic runs as a fully mirrored right-to-left interface rather than translated text in a left-to-right layout.\" },\n    { q: \"What happens if I uninstall it?\", a: \"Chrome deletes the local database with the extension. Export anything you want to keep before removing it — a full ZIP export takes a few seconds.\" }\n  ],\n  installSteps: [\n    { n: \"1\", title: \"Add the extension\", body: \"Open the Chrome Web Store listing and choose Add to Chrome. No permissions beyond claude.ai are requested.\" },\n    { n: \"2\", title: \"Pin it to the toolbar\", body: \"Click the puzzle-piece icon and pin Abrium so the popup is one click away.\" },\n    { n: \"3\", title: \"Open a conversation\", body: \"Visit claude.ai, open any artifact in Code view, and it appears in the Vault immediately.\" }\n  ],\n  releases: [\n    { version: \"v0.1.0\", date: \"August 2, 2026\", tag: \"Initial release\", items: [\"Auto-capture for Code, Markdown, HTML, SVG and React artifacts\", \"Side panel gallery with type filters, search and pinning\", \"Artifact detail view with preview, copy and download\", \"Batch selection with ZIP export\", \"Five interface languages with full RTL support for Arabic\", \"Local IndexedDB storage — no network access of any kind\"] }\n  ],\n  contactCards: [\n    { i: \"github\", title: \"Report an issue\", body: \"Bugs, missing captures or feature requests belong on the issue tracker. Include your Chrome version and the artifact type if something failed to capture.\", cta: \"Open GitHub issues\", placeholder: false },\n    { i: \"patreon\", title: \"Support the project\", body: \"Abrium stays free. If it saves you time, a small recurring contribution funds maintenance and the Chrome Web Store listing fee.\", cta: \"Patreon page\", placeholder: true }\n  ],\n  privacy: {\n    title: \"Privacy policy\", updated: \"Last updated · August 2, 2026\",\n    sections: [\n      { h: \"The short version\", p: [\"Abrium does not collect, transmit or sell any data. The extension has no server component. Everything it stores is written to your own browser and never leaves it.\", \"This website sets one cookie to remember your language and theme choices. Nothing else is tracked.\"] },\n      { h: \"What the extension stores\", p: [\"When you open an artifact on claude.ai in Code view, Abrium saves the artifact's contents, its title, its type, the name of the source conversation and the time of capture. This record is written to IndexedDB inside your browser profile.\", \"Message text outside the artifact panel is not read. Your account details, email address and conversation history are not accessible to the extension and are never requested.\"] },\n      { h: \"What the extension sends\", p: [\"Nothing. Abrium makes no outbound network requests. There is no analytics SDK, no crash reporter, no advertising identifier and no remote configuration. You can verify this by reading the source or by watching the network panel while the extension runs.\"] },\n      { h: \"Website analytics\", p: [\"abrium.onl serves static pages. There is no analytics script, no tag manager, and no third-party embed. Server access logs are kept by the host for a short retention period for security purposes and contain no identifiers we control or read.\"] },\n      { h: \"Cookies\", p: [\"A single first-party preference cookie stores your selected language and colour theme so the site looks the same on your next visit. You can reject it on the cookie preferences page; the site continues to work, and will simply default to your browser's language.\"] },\n      { h: \"Your data, your control\", p: [\"Because storage is local, deletion is local too. Remove individual artifacts from the side panel, clear the whole vault from the extension settings, or uninstall the extension to delete the database entirely.\", \"We cannot delete data on your behalf, because we never receive any.\"] },\n      { h: \"Changes to this policy\", p: [\"If this policy changes, the revision date above will change with it and the update will be listed in the public changelog. Material changes will be announced on the repository.\"] },\n      { h: \"Contact\", p: [\"Questions about privacy can be raised as an issue on the public repository, where the answer will be visible to everyone who has the same question.\"] }\n    ]\n  },\n  terms: {\n    title: \"Terms of use\", updated: \"Last updated · August 2, 2026\",\n    sections: [\n      { h: \"Acceptance\", p: [\"By installing the Abrium extension or using abrium.onl, you agree to these terms. If you do not agree, do not install the extension.\"] },\n      { h: \"Licence\", p: [\"Abrium is released as open source software. You may use, study, modify and redistribute it under the terms of the licence file published in the repository. That licence governs the code; these terms govern the hosted website and the distributed build.\"] },\n      { h: \"No warranty\", p: [\"The extension is provided as is, without warranty of any kind, express or implied. It stores data locally in your browser, and local storage can be cleared by the browser, by other software or by you. Keep exports of anything you cannot afford to lose.\", \"The maintainers are not liable for lost artifacts, lost work or any indirect damages arising from use of the software.\"] },\n      { h: \"Acceptable use\", p: [\"Use Abrium only with content you have the elogTitle: \"ما الذي تغيّر، ومتى.\",\n  contactTitle: \"تواصل معنا\", contactSub: \"طريقتان للوصول إلى المشروع. تقارير الأخطاء هي أنفع ما يمكنك إرساله.\",\n  cookieTitle: \"تفضيلات الكوكيز\",\n  cookieBody: \"يستخدم هذا الموقع ملف تعريف ارتباط واحداً لتذكّر لغتك ومظهرك. لا شيء غير ذلك — لا تحليلات، لا إعلانات، ولا نصوص من طرف ثالث. أما الإضافة نفسها فلا تستخدم أي كوكيز ولا تتصل بأي خادم.\",\n  currentStatus: \"الحالة الحالية\", cookieNote: \"يُحفظ اختيارك محلياً ويمكنك تغييره من هذه الصفحة في أي وقت.\",\n  acceptAll: \"قبول الكل\", rejectAll: \"رفض الكل\",\n  bannerText: \"يستخدم أبريوم ملف تفضيلات واحداً للغة والمظهر. بلا تحليلات، أبداً.\",\n  nfTitle: \"هذه الصفحة ليست في الخزنة.\", nfBody: \"قد يكون الرابط قديماً أو انتقلت الصفحة. كل ما عداها ما زال في مكانه.\",\n  backHome: \"العودة للرئيسية\",\n  footerTag: \"فهرس محلي لعناصر كلود. مجاني ومفتوح المصدر.\",\n  nav: { home: \"الرئيسية\", features: \"المزايا\", faq: \"الأسئلة\", download: \"التحميل\", changelog: \"السجل\" },\n  footProduct: \"المنتج\", footLegal: \"قانوني\",\n  linkPrivacy: \"الخصوصية\", linkTerms: \"الشروط\", linkContact: \"اتصل بنا\", linkCookies: \"تفضيلات الكوكيز\", linkSystem: \"نظام التصميم\",\n  trust: [\"مجاني للأبد\", \"مفتوح المصدر\", \"محلي بالكامل\", \"بلا تتبّع\"],\n  homeFeatures: [\n    { i: \"capture\", title: \"التقاط تلقائي\", body: \"يُحفظ كل عنصر تفتحه في المحادثة لحظة ظهوره — مع كل مراجعة، لتبقى النسخ السابقة قابلة للاسترجاع.\" },\n    { i: \"search\", title: \"معرض وبحث\", body: \"لوحة جانبية تعرض كل شيء حسب النوع والمحادثة والتاريخ. البحث يصل إلى متن العنصر لا إلى عنوانه فقط.\" },\n    { i: \"zip\", title: \"تصدير جماعي\", body: \"حدّد أي عدد من العناصر ونزّلها كملف ZIP منظّم بمجلدات وامتدادات صحيحة لكل نوع.\" },\n    { i: \"globe\", title: \"خمس لغات ودعم RTL\", body: \"الإنجليزية والعربية والفرنسية والإسبانية والبرتغالية. العربية تعكس التخطيط بالكامل — التنقّل والأيقونات وترتيب القراءة.\" }\n  ],\n  steps: [\n    { n: \"١\", title: \"ثبّت وثبّت الأيقونة\", body: \"أضف أبريوم من متجر كروم وثبّته في الشريط. لا شاشة تسجيل — لا يوجد حساب أصلاً.\" },\n    { n: \"٢\", title: \"اعمل كالمعتاد\", body: \"تابع استخدام claude.ai. حين يظهر عنصر في عرض الشيفرة، يحفظه أبريوم بعنوانه ونوعه ومحادثته.\" },\n    { n: \"٣\", title: \"جده لاحقاً\", body: \"افتح اللوحة الجانبية، ابحث أو رشّح، ثم عاين أو انسخ أو ثبّت أو صدّر ما تحتاج.\" }\n  ],\n  featureSections: [\n    { i: \"capture\", title: \"الالتقاط\", frame: \"الالتقاط · اللوحة\", body: \"يراقب أبريوم مساحة العناصر في الصفحة ويخزّن كلاً منها محلياً فور ظهوره. المراجعات تُحفظ كنسخ مرقّمة بدل استبدالها، فلا تكلّفك إعادة الكتابة المسوّدة الأولى.\", bullets: [\"عناصر شيفرة وMarkdown وHTML وSVG وReact\", \"كل مراجعة تُحفظ كنسخة مرقّمة\", \"يعمل أثرياً على المحادثات التي تعيد فتحها\"] },\n    { i: \"search\", title: \"التنظيم\", frame: \"المعرض · المرشّحات\", body: \"اللوحة الجانبية هي بيت كل ما التُقط. رشّح حسب النوع، ثبّت ما تعود إليه، وابحث في العناوين وأسماء المحادثات ومتون العناصر.\", bullets: [\"مرشّحات حسب النوع ومجموعة مثبّتة\", \"بحث نصي كامل داخل متون العناصر\", \"مرتّبة حسب وقت الالتقاط، الأحدث أولاً\"] },\n    { i: \"zip\", title: \"التصدير\", frame: \"التحديد الجماعي\", body: \"العنصر المفرد يُنزَّل بامتداده الصحيح. التحديد المتعدد يحوّل اللوحة إلى أداة جماعية بشريط إجراءات سفلي لتصدير ZIP أو التثبيت الجماعي.\", bullets: [\"تنزيل بنقرة أو نسخ إلى الحافظة\", \"تصدير ZIP بامتدادات حسب النوع\", \"تثبيت وحذف جماعيان\"] },\n    { i: \"lock\", title: \"الخصوصية\", frame: \"التخزين · IndexedDB\", body: \"كل شيء يعيش في تخزين متصفحك المحلي. لا خادم تُرسل إليه البيانات، ولا أدوات تحليل، ولا أي طلب شبكة تجريه الإضافة نيابةً عنك.\", bullets: [\"تخزين محلي في IndexedDB فقط\", \"بلا حسابات أو قياسات أو إعلانات\", \"شيفرة مصدرية علنية قابلة للتدقيق\"] },\n    { i: \"globe\", title: \"اللغات\", frame: \"الواجهة · العربية\", body: \"تتوفر الواجهة بخمس لغات. العربية نسخة كاملة من اليمين إلى اليسار: اللوحة والأشرطة والأيقونات ذات الاتجاه وترتيب القراءة كلها معكوسة.\", bullets: [\"EN · AR · FR · ES · PT\", \"عكس كامل للتخطيط لا مجرد قلب للنص\", \"يتبع لغة المتصفح افتراضياً\"] }\n  ],\n  faqs: [\n    { q: \"هل أبريوم مجاني؟\", a: \"نعم — مجاني، بلا خطة مدفوعة ولا ترقيات. الشيفرة علنية والمشروع مدعوم بالتبرعات الطوعية فقط.\" },\n    { q: \"هل يقرأ محادثاتي؟\", a: \"لا. ينظر أبريوم إلى لوحة العناصر وحدها — العنصر المعروض وعنوانه. محتوى الرسائل لا يُحلَّل ولا يُخزَّن ولا يُرسَل.\" },\n    { q: \"لماذا يحتاج عرض الشيفرة بدل المعاينة؟\", a: \"تعرض المعاينة العنصر داخل إطار معزول لا تستطيع الإضافات قراءته. أما عرض الشيفرة فيُظهر المصدر داخل الصفحة نفسها، وهو ما يحفظه أبريوم — لذا قد لا يُلتقط عنصر تُرك في وضع المعاينة حتى تبدّل العرض.\" },\n    { q: \"هل تُرسل بياناتي إلى أي مكان؟\", a: \"أبداً. لا تجري الإضافة أي طلب شبكة. كل شيء يُكتب في IndexedDB المحلي ويبقى على جهازك، حتى عند تصدير ملف ZIP.\" },\n    { q: \"ما اللغات المدعومة؟\", a: \"الإنجليزية والعربية والفرنسية والإسبانية والبرتغالية. العربية واجهة معكوسة بالكامل من اليمين إلى اليسار، لا نص مترجم داخل تخطيط لاتيني.\" },\n    { q: \"ماذا يحدث إن أزلت الإضافة؟\", a: \"يحذف كروم قاعدة البيانات المحلية مع الإضافة. صدّر ما تريد الاحتفاظ به قبل الإزالة — تصدير ZIP كامل يستغرق ثوانٍ.\" }\n  ],\n  installSteps: [\n    { n: \"١\", title: \"أضف الإضافة\", body: \"افتح صفحة المتجر واختر «أضف إلى كروم». لا أذونات مطلوبة خارج claude.ai.\" },\n    { n: \"٢\", title: \"ثبّتها في الشريط\", body: \"اضغط أيقونة القطعة وثبّت أبريوم لتكون النافذة على بُعد نقرة.\" },\n    { n: \"٣\", title: \"افتح محادثة\", body: \"ادخل claude.ai، افتح أي عنصر في عرض الشيفرة، وسيظهر في الخزنة فوراً.\" }\n  ],\n  releases: [\n    { version: \"v0.1.0\", date: \"٢ أغسطس ٢٠٢٦\", tag: \"الإصدار الأول\", items: [\"التقاط تلقائي لعناصر الشيفرة وMarkdown وHTML وSVG وReact\", \"معرض في اللوحة الجانبية مع مرشّحات وبحث وتثبيت\", \"عرض تفصيلي للعنصر مع معاينة ونسخ وتنزيل\", \"تحديد جماعي مع تصدير ZIP\", \"خمس لغات للواجهة مع دعم كامل للعربية\", \"تخزين محلي في IndexedDB — بلا أي اتصال بالشبكة\"] }\n  ],\n  contactCards: [\n    { i: \"github\", title: \"أبلغ عن مشكلة\", body: \"الأخطاء والالتقاطات الناقصة وطلبات المزايا مكانها متتبّع المشكلات. أرفق إصدار كروم ونوع العنصر إن فشل الالتقاط.\", cta: \"افتح صفحة المشكلات\", placeholder: false },\n    { i: \"patreon\", title: \"ادعم المشروع\", body: \"سيبقى أبريوم مجانياً. إن وفّر عليك وقتاً، فمساهمة صغيرة متكرّرة تموّل الصيانة ورسوم المتجر.\", cta: \"صفحة Patreon\", placeholder: true }\n  ],\n  privacy: {\n    title: \"سياسة الخصوصية\", updated: \"آخر تحديث · ٢ أغسطس ٢٠٢٦\",\n    sections: [\n      { h: \"باختصار\", p: [\"لا يجمع أبريوم أي بيانات ولا يرسلها ولا يبيعها. لا يوجد للإضافة أي مكوّن خادم. كل ما تخزّنه يُكتب في متصفحك ولا يغادره.\", \"يضع هذا الموقع ملف تعريف ارتباط واحداً لتذكّر اللغة والمظهر. لا شيء آخر يُتتبَّع.\"] },\n      { h: \"ما الذي تخزّنه الإضافة\", p: [\"حين تفتح عنصراً على claude.ai في عرض الشيفرة، يحفظ أبريوم محتواه وعنوانه ونوعه واسم المحادثة المصدر ووقت الالتقاط. يُكتب هذا السجل في IndexedDB داخل ملف متصفحك.\", \"لا يُقرأ نص الرسائل خارج لوحة العناصر. تفاصيل حسابك وبريدك وسجل محادثاتك غير متاحة للإضافة ولا تُطلب أبداً.\"] },\n      { h: \"ما الذي ترسله الإضافة\", p: [\"لا شيء. لا يجري أبريوم أي طلب شبكة صادر. لا أدوات تحليل، ولا مبلّغ أعطال، ولا معرّف إعلاني، ولا إعدادات عن بُعد. يمكنك التحقق بقراءة المصدر أو بمراقبة لوحة الشبكة أثناء التشغيل.\"] },\n      { h: \"تحليلات الموقع\", p: [\"يقدّم abrium.onl صفحات ثابتة. لا نص تحليلات ولا مدير وسوم ولا تضمين من طرف ثالث. يحتفظ المستضيف بسجلات وصول لفترة قصيرة لأغراض أمنية، ولا تتضمّن معرّفات نتحكّم بها أو نقرأها.\"] },\n      { h: \"الكوكيز\", p: [\"ملف تفضيلات واحد من الطرف الأول يخزّن لغتك ومظهرك ليبدو الموقع كما تركته في زيارتك القادمة. يمكنك رفضه من صفحة التفضيلات؛ سيظل الموقع يعمل معتمداً على لغة المتصفح.\"] },\n      { h: \"بياناتك بين يديك\", p: [\"لأن التخزين محلي، فالحذف محلي أيضاً. احذف عناصر مفردة من اللوحة، أو امسح الخزنة كلها من الإعدادات، أو أزل الإضافة لحذف قاعدة البيانات بالكامل.\", \"لا يمكننا حذف بياناتك نيابةً عنك، لأننا لا نستلم منها شيئاً.\"] },\n      { h: \"تغييرات السياسة\", p: [\"إن تغيّرت هذه السياسة، سيتغيّر تاريخ المراجعة أعلاه وسيُدرج التحديث في سجل التغييرات العلني. وتُعلن التغييرات الجوهرية في المستودع.\"] },\n      { h: \"التواصل\", p: [\"أسئلة الخصوصية يمكن طرحها كمشكلة في المستودع العلني، حيث تكون الإجابة ظاهرة لكل من لديه السؤال نفسه.\"] }\n    ]\n  },\n  terms: {\n    title: \"شروط الاستخدام\", updated: \"آخر تحديث · ٢ أغسطس ٢٠٢٦\",\n    sections: [\n      { h: \"القبول\", p: [\"بتثبيت إضافة أبريوم أو استخدام abrium.onl فإنك توافق على هذه الشروط. إن لم توافق فلا تثبّت الإضافة.\"] },\n      { h: \"الترخيص\", p: [\"أبريوم برمجية مفتوحة المصدر. يمكنك استخدامها ودراستها وتعديلها وإعادة توزيعها وفق ملف الترخيص المنشور في المستودع. ذلك الترخيص يحكم الشيفرة، وهذه الشروط تحكم الموقع والنسخة الموزّعة.\"] },\n      { h: \"بلا ضمان\", p: [\"تُقدَّم الإضافة كما هي، بلا ضمان من أي نوع. تخزّن البيانات محلياً في متصفحك، والتخزين المحلي قابل للمسح من المتصفح أو من برمجيات أخرى أو منك. احتفظ بنسخ مصدّرة لما لا تحتمل فقدانه.\", \"لا يتحمّل القائمون على المشروع مسؤولية فقدان العناصر أو العمل أو أي أضرار غير مباشرة.\"] },\n      { h: \"الاستخدام المقبول\", p: [\"استخدم أبريوم مع محتوى تملك حق تخزينه. أنت مسؤول عمّا تلتقطه وتصدّره وعن الالتزام بشروط أي خدمة تلتقط منها، بما فيها شروط Anthropic لـ claude.ai.\"] },\n      { h: \"العلاقة بـ Anthropic\", p: [\"أبريوم مشروع مستقل، غير تابع لـ Anthropic ولا معتمد منها ولا برعايتها. Claude وclaude.ai علامتان تجاريتان لمالكهما، وتُذكران هنا لوصف التوافق فقط.\"] },\n      { h: \"التوفّر\", p: [\"قد يتغيّر الموقع أو صفحة المتجر أو يتوقفان في أي وقت. ولأن الإضافة تعمل محلياً بالكامل، فتعطّل أيٍّ منهما لا يؤثر على نسخة مثبّتة.\"] },\n      { h: \"تغيير الشروط\", p: [\"تسري الشروط المحدّثة عند نشرها مع تغيير تاريخ المراجعة أعلاه. ويُعد الاستمرار في الاستخدام بعد النشر قبولاً بها.\"] }\n    ]\n  }\n};\n\nconst FR = {\n  addToChrome: \"Ajouter à Chrome\", viewGithub: \"Voir sur GitHub\", getIt: \"Obtenir Abrium\",\n  eyebrow: \"Extension Chrome · v0.1.0\",\n  heroTitle: \"Ne perdez plus jamais un Artifact de Claude.\",\n  hero
